name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v3.1.0

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
            artifact: go-gh-macos-arm64
          - name: Windows (x86_64)
            os: windows-latest
            artifact: go-gh-windows-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs tags

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Determine version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Package
        env:
          # GitHub App settings, stored as repository variables
          # (Settings → Secrets and variables → Actions → Variables). Neither is secret.
          GH_APP_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
          GH_APP_SLUG: ${{ vars.GH_APP_SLUG }}
        run: |
          if [ -z "$GH_APP_CLIENT_ID" ]; then
            echo "::warning::Repository variable GH_APP_CLIENT_ID is not set; the build will not be able to log in."
          fi
          if [ -z "$GH_APP_SLUG" ]; then
            echo "::warning::Repository variable GH_APP_SLUG is not set; install links will be missing."
          fi
          LDFLAGS="-X main.githubClientID=${GH_APP_CLIENT_ID} -X main.githubAppSlug=${GH_APP_SLUG} -X main.version=${{ steps.version.outputs.version }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            wails3 task package INSTALL_SCOPE=user EXTRA_LDFLAGS="$LDFLAGS"
          else
            wails3 task package EXTRA_LDFLAGS="$LDFLAGS"
          fi

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Type-check frontend
        working-directory: frontend
        run: npm run check

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          codesign --verify --deep --strict bin/go-gh.app
          ditto -c -k --keepParent bin/go-gh.app dist/go-gh-macos-arm64.zip

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp bin/go-gh.exe dist/go-gh-windows-amd64.exe
          cp bin/go-gh-amd64-installer.exe dist/go-gh-windows-amd64-installer.exe

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "| Version | Artifact | Files |"
            echo "|---|---|---|"
            echo "| \`${{ steps.version.outputs.version }}\` | \`${{ matrix.artifact }}\` | $(ls dist | sed 's/.*/`&`/' | paste -sd ' ' -) |"
          } >> "$GITHUB_STEP_SUMMARY"
